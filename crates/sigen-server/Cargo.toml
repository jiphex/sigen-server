[package]
name = "sigen-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Share reqwest's ring provider instead of also enabling aws-lc in rustls.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sigen-modbus = { path = "../sigen-modbus" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[dev-dependencies]
bytes = "1"
tower = { version = "0.5", features = ["util"] }
