name: Container image

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag such as 1.0.2'; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push architecture image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.release.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Verify packaged binaries
        env:
          VERSION: ${{ needs.release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="$IMAGE:$VERSION-$ARCH"
          test "$(docker run --rm "$image" --version)" = "sigen-server $VERSION"
          test "$(docker run --rm --entrypoint /sigen-journal "$image" --version)" = "sigen-journal $VERSION"

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform release
        env:
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "Published \`$IMAGE:$VERSION\` and \`$IMAGE:latest\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
