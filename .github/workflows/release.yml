name: Release binaries

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.99.1
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag such as 1.0.2'; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Build static Linux binaries
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/build" -w /build \
            -e CARGO_PROFILE_RELEASE_STRIP -e CARGO_PROFILE_RELEASE_LTO \
            -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS \
            "rust:$RUST_VERSION-alpine3.23" \
            cargo build --locked --release --workspace --bins
      - name: Build macOS binaries
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          cargo +"$RUST_VERSION" build --locked --release --workspace --bins --target "$TARGET"
          mkdir -p target/release
          cp target/"$TARGET"/release/{sigen-server,sigen-journal,sigen-simulator} target/release/
      - name: Verify and package binaries
        env:
          VERSION: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          for binary in sigen-server sigen-journal sigen-simulator; do
            test "$("target/release/$binary" --version)" = "$binary $VERSION"
            "target/release/$binary" --help > /dev/null
          done
          archive="sigen-server-$VERSION-$TARGET"
          mkdir -p "dist/$archive"
          cp target/release/{sigen-server,sigen-journal,sigen-simulator} "dist/$archive/"
          cp LICENSE README.md "dist/$archive/"
          mkdir -p "dist/$archive/crates/sigen-server" "dist/$archive/crates/sigen-modbus"
          cp crates/sigen-server/README.md "dist/$archive/crates/sigen-server/"
          cp crates/sigen-modbus/README.md "dist/$archive/crates/sigen-modbus/"
          tar -czf "dist/$archive.tar.gz" -C dist "$archive"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" *.tar.gz SHA256SUMS --clobber
          else
            gh release create "$VERSION" *.tar.gz SHA256SUMS \
              --verify-tag --title "$VERSION" --generate-notes
          fi
          echo "Published binaries: https://github.com/$GH_REPO/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"
